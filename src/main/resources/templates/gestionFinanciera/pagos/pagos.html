<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="layout :: head('Gestión de Pagos')"></head>

<body>

    <div class="layout-container">

        <aside th:replace="layout :: sidebar"></aside>

        <main class="content">

            <h1 class="mb-4">Gestión de Pagos</h1>
            <div th:if="${mensaje}" th:text="${mensaje}" th:class="'alert alert-' + ${mensajeTipo}"></div>
            <div th:if="${param.eliminado}" class="alert alert-success">Pago anulado correctamente.</div>
            <div th:if="${param.errorEliminar}" class="alert alert-danger">Error al anular el pago.</div>


            <div class="card p-4">
                <h2 class="mb-4">Lista de Pagos Registrados</h2>

                <form class="row g-3 mb-4" method="get" action="/pagos">

                    <div class="col-md-4">
                        <input type="text" class="form-control" name="idPago" placeholder="Buscar por ID de pago"
                            th:value="${idPago}">
                    </div>

                    <div class="col-md-4">
                        <input type="text" class="form-control" name="cedulaApoderado"
                            placeholder="Buscar por cédula del apoderado" th:value="${cedulaApoderado}">
                    </div>

                    <div class="col-md-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary mb-3">Buscar</button>
                        <a href="/pagos" class="btn btn-secondary mb-3">Limpiar</a>
                    </div>
                </form>

                <div class="tabla-scroll">

                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>ID Pago</th>
                                <th>ID Factura</th>
                                <th>Fecha de Emisión</th>
                                <th>Cédula del Apoderado</th>
                                <th>Cédula del Infante</th>
                                <th>Monto Total</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="p : ${listaPagos}">
                                <td th:text="${p.idPago}"></td>
                                <td th:text="${p.idFactura}"></td>
                                <td th:text="${p.fechaEmision}"></td>
                                <td th:text="${p.cedulaApoderado}"></td>
                                <td th:text="${p.cedulaInfante}"></td>
                                <td th:text="${p.montoTotal}"></td>
                                <td th:text="${p.estado}"></td>
                                <td>
                                    <button th:if="${rol == 'ADMINISTRADOR'}" class="btn btn-danger btn-sm" data-bs-toggle="modal"
                                        data-bs-target="#modalEliminar"
                                        th:attr="data-id=${p.idPago}, data-idfactura=${p.idFactura}">
                                        Eliminar 
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="modalEliminar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Confirmar eliminación</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    ¿Está seguro que desea anular este pago?
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <a id="btnConfirmarEliminar" class="btn btn-danger">Eliminar</a>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
<style>
    .tabla-scroll {
        max-height: calc(80vh - 100px);
        overflow-y: auto;
        overflow-x: auto;
        padding-right: 10px;
        border: 1px solid #ddd;
        background: white;
    }

    .tabla-scroll table {
        width: max-content;
        min-width: 100%;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modalEliminar = document.getElementById('modalEliminar');

        modalEliminar.addEventListener('show.bs.modal', event => {
            const button = event.relatedTarget;

            const idPago = button.getAttribute('data-id');
            const idFactura = button.getAttribute('data-idfactura');

            document.getElementById('btnConfirmarEliminar')
                .setAttribute('href', '/pagos/eliminar/' + idPago + '/' + idFactura);
        });
    });
</script>



</html>
