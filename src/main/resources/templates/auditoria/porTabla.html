<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout :: head('Auditoría por Tabla')}"></head>

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <th:block th:fragment="content">

        <div class="d-flex align-items-center mb-4">
            <h1 class="fw-bold text-primary mb-0">🗃️ Auditoría por Tabla Específica</h1>
        </div>

        <div class="card shadow-lg border-0 rounded-4 p-4 bg-light">

            <h5 class="fw-semibold text-secondary mb-3">Seleccione una tabla:</h5>

            <form th:action="@{/auditoria/tabla}" method="get">

                <select class="form-select rounded-3 mb-3" name="nombreTabla" required>
                    <option value="">-- Seleccione una tabla --</option>
                    <option th:each="tabla : ${tablas}"
                            th:value="${tabla.NOMBRE_TABLA}"
                            th:text="${tabla.NOMBRE_TABLA}">
                    </option>
                </select>

                <button class="btn btn-primary rounded-3 px-4 py-2">
                    <i class="bi bi-search me-2"></i>Ver Auditoría
                </button>

            </form>

        </div>

        <a th:href="@{/auditoria}" class="btn btn-secondary mt-4">
            <i class="bi bi-arrow-left me-2"></i>Volver al Menú
        </a>

    </th:block>

</div>

</body>
</html>
