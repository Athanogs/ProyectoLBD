<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout :: head('Auditoría del Sistema')}"></head>

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <th:block th:fragment="content">

        <div class="d-flex align-items-center mb-4">
            <h1 class="fw-bold text-primary mb-0">📋 Auditoría del Sistema</h1>
        </div>

        <div class="card shadow-lg border-0 rounded-4 p-4 bg-light">

            <h4 class="fw-semibold text-secondary mb-3">Seleccione el tipo de auditoría:</h4>

            <div class="list-group list-group-flush">

                <a th:href="@{/auditoria/general}"
                   class="list-group-item list-group-item-action py-3 d-flex justify-content-between align-items-center rounded-3 my-2 shadow-sm audit-item">
                    <div>
                        <span class="fw-bold">📊 Auditoría General</span><br>
                        <small class="text-muted">Todas las acciones del sistema</small>
                    </div>
                    <span class="badge bg-primary rounded-pill px-3 py-2">Ver</span>
                </a>

                <a th:href="@{/auditoria/tabla/form}"
                   class="list-group-item list-group-item-action py-3 d-flex justify-content-between align-items-center rounded-3 my-2 shadow-sm audit-item">
                    <div>
                        <span class="fw-bold">🗃️ Por Tabla Específica</span><br>
                        <small class="text-muted">Seleccionar una tabla</small>
                    </div>
                    <span class="badge bg-primary rounded-pill px-3 py-2">Ver</span>
                </a>
                
            </div>
        </div>

        <style>
            .audit-item {
                background: white;
                border: none;
                transition: all 0.25s ease;
            }
            .audit-item:hover {
                transform: translateY(-3px);
                background: #f8f9ff;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            }
        </style>

    </th:block>

</div>

</body>
</html>
