<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="layout :: head('Gestión de Infantes')"></head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>
    <div class="d-flex">
        <aside th:replace="layout :: sidebar"></aside>

        <main class="content">
            <h1 class="mb-4">Gestión de Infantes</h1>

            <div class="card p-4">
                <h2 class="mb-4">Lista de Infantes</h2>

                <form class="row g-2 mb-3" th:action="@{/infantes/buscar}" method="get">
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="cedula" placeholder="Buscar por cédula"
                            th:value="${cedula}">
                    </div>

                    <div class="col-md-4">
                        <input type="text" class="form-control" name="nombre" placeholder="Buscar por nombre o apellido"
                            th:value="${nombre}">
                    </div>

                    <div class="col-md-4 d-flex gap-2">
                        <button type="submit" class="btn btn-success mb-3">Buscar</button>
                        <a th:href="@{/infantes}" class="btn btn-secondary mb-3">Limpiar</a>
                        <a class="btn btn-primary mb-3" th:href="@{/infantes/crear}">+ Crear Infante</a>
                        <a class="btn btn-warning mb-3" th:href="@{/infantes/inactivos}">Inactivos</a>
                    </div>
                </form>

                <div class="tabla-scroll table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Cédula</th>
                                <th>Nombre</th>
                                <th>Apellido Paterno</th>
                                <th>Apellido Materno</th>
                                <th>Fecha Nacimiento</th>
                                <th>Cédula Padre</th>
                                <th>Grupo</th>
                                <th>Alergias</th>
                                <th>Medicamentos</th>
                                <th>Vacunas</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="infante : ${infantes}">
                                <td th:text="${infante.cedulaInfante}"></td>
                                <td th:text="${infante.nombre}"></td>
                                <td th:text="${infante.apellidoPaterno}"></td>
                                <td th:text="${infante.apellidoMaterno}"></td>
                                <td th:text="${infante.fechaNacimiento}"></td>
                                <td th:text="${infante.cedulaPadre}"></td>
                                <td th:text="${infante.nombreGrupo}"></td>
                                <td th:text="${infante.alergias}"></td>
                                <td th:text="${infante.medicamentos}"></td>
                                <td th:text="${infante.vacunas}"></td>

                                <td th:text="${infante.estado == 1 ? 'Activo' : 'Inactivo'}"></td>

                                <td class="text-center">
                                    <a th:href="@{'/infantes/editar/' + ${infante.cedulaInfante}}"
                                        class="btn btn-warning btn-sm"><i class="bi bi-pencil-fill"></i></a>

                                    <a th:href="@{'/infantes/eliminar/' + ${infante.cedulaInfante}}"
                                        class="btn btn-danger btn-sm"
                                        onclick="return confirm('¿Está seguro de eliminar este infante?');">
                                        <i class="bi bi-trash-fill"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

</body>
<style>
    aside {
        flex-shrink: 0;
    }

    .tabla-scroll {
        max-height: calc(80vh - 100px);
        overflow-y: auto;
        border: 1px solid #ddd;
        background: white;
        padding-right: 10px;
    }

    .tabla-scroll .table {
        min-width: 1200px;
    }
</style>

</html>
