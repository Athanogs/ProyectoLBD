<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="layout :: head('Registro de Asistencias')"></head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>
    <div class="d-flex">
        <aside th:replace="layout :: sidebar"></aside>

        <main class="content">
            <h1 class="mb-4">Registro de Asistencias</h1>

            <div class="card p-4">
                <h2 class="mb-4">Lista de Asistencias</h2>

                <form class="row g-3 mb-4" method="get" th:action="@{/asistencia}">
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="nombre"
                            placeholder="Buscar por nombre o apellidos" th:value="${nombre}">
                    </div>

                    <div class="col-md-4">
                        <input type="text" class="form-control" name="cedula" placeholder="Buscar por cédula"
                            th:value="${cedula}">
                    </div>

                    <div class="col-md-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary mb-3">Buscar</button>
                        <a href="/asistencia" class="btn btn-secondary mb-3">Limpiar</a>
                        <a href="/asistencia/nueva" class="btn btn-primary mb-3"> + Nueva Asistencia </a>
                    </div>
                </form>

                <div class="tabla-scroll">
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>Cédula</th>
                                <th>Nombre Completo</th>
                                <th>Fecha Nacimiento</th>
                                <th>Fecha Asistencia</th>
                                <th>Hora Entrada</th>
                                <th>Hora Salida</th>
                                <th>Observaciones</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="a : ${listaAsistencias}">
                                <td th:text="${a.cedulaInfante}"></td>
                                <td th:text="${a.nombreInfante + ' ' + a.apellidoPaterno + ' ' + a.apellidoMaterno}">
                                </td>
                                <td th:text="${a.fechaNacimiento}"></td>
                                <td th:text="${a.fechaAsistencia}"></td>
                                <td th:text="${a.horaEntrada}"></td>
                                <td th:text="${a.horaSalida}"></td>
                                <td th:text="${a.observaciones}"></td>
                                <td th:text="${a.estadoAsistencia}"></td>

                                <td class="text-center">
                                    <a th:href="@{'/asistencia/editar/' + ${a.cedulaInfante} + '/' + ${a.fechaAsistencia}}"
                                        class="btn btn-warning btn-sm"><i class="bi bi-pencil-fill"></i></a>
                                    <a th:href="@{'/asistencia/eliminar/' + ${a.cedulaInfante} + '/' + ${a.fechaAsistencia}}"
                                        class="btn btn-danger btn-sm"
                                        onclick="return confirm('¿Desea eliminar este registro?');"><i
                                            class="bi bi-trash-fill"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listaAsistencias)}">
                                <td colspan="9" class="text-center">No se encontraron registros de asistencia</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    </div>
</body>
<style>
    aside {
        flex-shrink: 0;
    }

    .tabla-scroll {
        max-height: calc(80vh - 100px);
        overflow-y: auto;
        border: 1px solid #ddd;
        background: white;
        padding-right: 10px;
    }

    .tabla-scroll .table {
        min-width: 1200px;
    }
</style>

</html>
