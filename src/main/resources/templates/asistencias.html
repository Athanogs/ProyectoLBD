<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: head('Registro de Asistencias')}"></head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <aside th:replace="layout :: sidebar"></aside>

        <!-- Contenido principal -->
        <main class="flex-grow-1 p-4">
            <div class="container-fluid">
                <div class="d-flex justify-content-between mb-4">
                    <h2 class="fw-bold">Registro de Asistencias</h2>
                    <a href="/asistencias/nueva" class="btn btn-primary">+ Nueva Asistencia</a>
                </div>

                <!-- Formulario de búsqueda -->
        <form class="row g-3 mb-4" method="get" th:action="@{/asistencias}">
    <div class="col-md-6">
        <input type="text" class="form-control" name="nombre"
               placeholder="Buscar por nombre o apellidos" th:value="${nombre}">
    </div>
    <!-- Agregue esto nuevo -->
    <div class="col-md-4">
        <input type="text" class="form-control" name="cedula"
               placeholder="Buscar por cédula" th:value="${cedula}">
    </div>

    <div class="col-md-6 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Buscar</button>
        <a href="/asistencias" class="btn btn-secondary">Limpiar</a>
    </div>
</form>


                <!-- Tabla -->
                <div class="card shadow">
                    <div class="card-body p-0">
                        <table class="table table-striped table-bordered mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Cédula</th>
                                    <th>Nombre Completo</th>
                                    <th>Fecha Nac.</th>
                                    <th>Fecha Asistencia</th>
                                    <th>Hora Entrada</th>
                                    <th>Hora Salida</th>
                                    <th>Observaciones</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="a : ${listaAsistencias}">
                                    <td th:text="${a.cedulaInfante}"></td>
                                    <td th:text="${a.nombreInfante} + ' ' + ${a.apellidoPaterno} + ' ' + ${a.apellidoMaterno}"></td>
                                    <td th:text="${a.fechaNacimiento}"></td>
                                    <td th:text="${a.fechaAsistencia}"></td>
                                    <td th:text="${a.horaEntrada}"></td>
                                    <td th:text="${a.horaSalida}"></td>
                                    <td th:text="${a.observaciones}"></td>
                                    <td th:text="${a.estadoAsistencia}"></td>
                                    <td class="text-center">
                                        <a th:href="@{'/asistencias/editar/' + ${a.cedulaInfante} + '/' + ${a.fechaAsistencia}}" 
                                           class="btn btn-warning btn-sm">Editar</a>
                                        <a th:href="@{'/asistencias/eliminar/' + ${a.cedulaInfante} + '/' + ${a.fechaAsistencia}}"
                                           class="btn btn-danger btn-sm"
                                           onclick="return confirm('¿Desea eliminar este registro?');">
                                            Eliminar
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(listaAsistencias)}">
                                    <td colspan="9" class="text-center">No se encontraron registros de asistencia</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
