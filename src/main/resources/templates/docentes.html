<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<!-- Cargar el head -->
<head th:replace="layout :: head('Gestión de Usuarios')"></head>

<body>

<div class="d-flex">

    <!-- Cargar el sidebar -->
    <aside th:replace="layout :: sidebar"></aside>

    <!-- CONTENIDO PROPIO (NO VIENE DE LAYOUT) -->
    <main class="content">

        <h1 class="mb-4">Gestión de Docentes</h1>

        <div class="card p-4">
            <h2 class="mb-4">Lista de Docentes</h2>

            <!-- FORMULARIO DE BÚSQUEDA -->
            <form class="row g-3 mb-4" method="get" action="/docentes">

                <!-- Buscar por cédula -->
                <div class="col-md-4">
                    <input type="text"
                        class="form-control"
                        name="cedula"
                        placeholder="Buscar por cédula"
                        th:value="${cedula}">
                </div>

                <!-- Buscar por nombre o apellido -->
                <div class="col-md-4">
                    <input type="text"
                        class="form-control"
                        name="nombre"
                        placeholder="Buscar por nombre o apellido"
                        th:value="${nombre}">
                </div>

                <!-- Botones -->
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <a href="/docentes" class="btn btn-secondary">Limpiar</a>
                </div>

            </form>

            <!-- TABLA DE RESULTADOS -->
            <table class="table table-striped table-bordered">
                <thead>
                <tr>
                    <th>Cédula</th>
                    <th>Nombre</th>
                    <th>Apellido Paterno</th>
                    <th>Apellido Materno</th>
                    <th>Fecha Nacimiento</th>
                    <th>Username</th>
                    <th>Contraseña</th>
                    <th>Rol</th>
                    <th>Acciones</th> <!-- Nueva columna -->
                </tr>
                </thead>

                <tbody>
                <tr th:each="u : ${listaUsuarios}">
                    <td th:text="${u.cedula}"></td>
                    <td th:text="${u.nombre}"></td>
                    <td th:text="${u.apellidoPaterno}"></td>
                    <td th:text="${u.apellidoMaterno}"></td>
                    <td th:text="${u.fechaNacimiento}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.contrasena}"></td>
                    <td th:text="${u.rol}"></td>

                    <!-- Botones -->
                    <td>
                        <a th:href="@{'/docentes/ver/' + ${u.cedula}}"
                        class="btn btn-info btn-sm">Ver</a>

                        <a th:href="@{'/usuarios/editar/' + ${u.cedula}}"
                        class="btn btn-warning btn-sm">Editar</a>

                        <a th:href="@{'/docentes/eliminar/' + ${u.cedula}}"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('¿Eliminar este usuario?');">
                            Eliminar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

</div>

</body>
</html>
