<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout :: head('Gestión de Contactos')}"></head>

<body>

<!-- === LLAMADO CORRECTO AL LAYOUT === -->
<div th:replace="~{layout :: layout(~{::content})}">

    <!-- === CONTENIDO REAL DEL MÓDULO === -->
    <th:block th:fragment="content">

        <h1>Gestión de Contactos</h1>

        <!-- SWEETALERT -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script>
        function confirmarEliminacion(event) {
            event.preventDefault();

            Swal.fire({
                title: '¿Estás seguro?',
                text: 'Esta acción no se puede deshacer.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    event.target.submit();
                }
            });
        }
        </script>

        <!-- ERRORES -->
        <script th:if="${error == 'correo'}">
            Swal.fire('Correo duplicado', 'Este correo ya existe.', 'error');
        </script>

        <script th:if="${error == 'telefono'}">
            Swal.fire('Teléfono duplicado', 'Este teléfono ya existe.', 'error');
        </script>

        <!-- ÉXITOS -->
        <script th:if="${success == 'correo-agregado'}">
            Swal.fire('¡Éxito!', 'Correo agregado correctamente.', 'success');
        </script>

        <script th:if="${success == 'telefono-agregado'}">
            Swal.fire('¡Éxito!', 'Teléfono agregado correctamente.', 'success');
        </script>

        <script th:if="${success == 'correo-eliminado'}">
            Swal.fire('¡Éxito!', 'Correo eliminado correctamente.', 'success');
        </script>

        <script th:if="${success == 'telefono-eliminado'}">
            Swal.fire('¡Éxito!', 'Teléfono eliminado correctamente.', 'success');
        </script>

        <!-- TABLA -->
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Correos</th>
                <th>Teléfonos</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="c : ${contactos}">

                <td th:text="${c.cedula}"></td>
                <td th:text="${c.nombreCompleto}"></td>

                <!-- CORREOS -->
                <td>
                    <div th:each="correo : ${c.emails != null ? #strings.listSplit(c.emails, ', ') : {}}">
                        <span class="badge bg-primary me-2" th:text="${correo}"></span>

                        <form th:action="@{'/contactos/eliminar-correo/' + ${c.cedula}}"
                              method="post" class="d-inline"
                              onsubmit="confirmarEliminacion(event)">
                            <input type="hidden" name="correo" th:value="${correo}">
                            <button class="btn btn-danger btn-sm">✖</button>
                        </form>
                        <br>
                    </div>
                </td>

                <!-- TELEFONOS -->
                <td>
                    <div th:each="tel : ${c.telefonos != null ? #strings.listSplit(c.telefonos, ', ') : {}}">
                        <span class="badge bg-success me-2" th:text="${tel}"></span>

                        <form th:action="@{'/contactos/eliminar-telefono/' + ${c.cedula}}"
                              method="post" class="d-inline"
                              onsubmit="confirmarEliminacion(event)">
                            <input type="hidden" name="telefono" th:value="${tel}">
                            <button class="btn btn-danger btn-sm">✖</button>
                        </form>
                        <br>
                    </div>
                </td>

                <!-- FORMULARIOS DE AGREGAR -->
                <td>

                    <!-- NUEVO CORREO -->
                    <form th:action="@{'/contactos/agregar-correo/' + ${c.cedula}}"
                          method="post" class="mb-2 d-flex">
                        <input type="email" name="nuevoCorreo"
                               class="form-control form-control-sm"
                               placeholder="Nuevo correo" required>

                        <button class="btn btn-success btn-sm ms-2">➕</button>
                    </form>

                    <!-- NUEVO TELEFONO -->
                    <form th:action="@{'/contactos/agregar-telefono/' + ${c.cedula}}"
                          method="post" class="d-flex">
                        <input type="text" name="nuevoTelefono"
                               class="form-control form-control-sm"
                               placeholder="Nuevo teléfono" required>

                        <button class="btn btn-primary btn-sm ms-2">📞</button>
                    </form>

                </td>

            </tr>
            </tbody>
        </table>

    </th:block>

</div>

</body>
</html>
