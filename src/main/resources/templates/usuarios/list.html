<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"/><title>Usuarios</title></head>
<body>
  <h1>Usuarios</h1>
  <a th:href="@{/usuarios/nuevo}"><button type="button">Crear persona / usuario</button></a>

  <table>
    <thead><tr><th>Cédula</th><th>Username</th><th>Rol</th></tr></thead>
    <tbody>
      <tr th:each="u : ${usuarios}">
        <td th:text="${u.cedula}"></td>
        <td th:text="${u.username}"></td>
        <td th:text="${u.rol != null ? u.rol.nombre : ''}"></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
