<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Crear Persona</title>

    <!-- BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background-color: #f4ecdc !important; /* Tu color */
        }

        .card {
            border-radius: 12px;
        }

        .card-body {
            background: #ffffff;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">
        <h2 class="fw-bold">Crear Persona / Usuario</h2>
        <a href="/usuarios" class="btn btn-secondary">← Volver</a>
    </div>

    <!-- Error -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow">
        <div class="card-body">

            <p th:text="'DEBUG: PAIS=' + *{idPais} + 
            ', PROV=' + *{idProvincia} + 
            ', CANT=' + *{idCanton} + 
            ', DIST=' + *{idDistrito}"></p>


            <p th:text="'DEBUG CONTRA: ' + *{contrasena}"></p>

            <form th:action="${modoEdicion} ? @{/usuarios/actualizar} : @{/usuarios/guardar}"
                th:object="${personaForm}" method="post">


                <p th:text="'DEBUG: PAIS=' + ${personaForm.idPais} +
                ', PROV=' + ${personaForm.idProvincia} + 
                ', CANT=' + ${personaForm.idCanton} + 
                ', DIST=' + ${personaForm.idDistrito}"></p>
                <!-- FILA 1 -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Cédula</label>
                        <input type="text" class="form-control" th:field="*{cedula}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Fecha Nacimiento</label>
                        <input type="date" class="form-control" th:field="*{fechaNacimiento}">
                    </div>
                </div>

                <!-- FILA 2 -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Apellido Paterno</label>
                        <input type="text" class="form-control" th:field="*{apellidoPaterno}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Apellido Materno</label>
                        <input type="text" class="form-control" th:field="*{apellidoMaterno}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Rol</label>
                        <select class="form-select" th:field="*{idRol}" required>
                            <option value="">Seleccione Rol</option>
                            <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombre}"></option>
                        </select>
                    </div>
                </div>

                <!-- FILA 3 -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" th:field="*{username}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Contraseña</label>

                        <!-- Crear: contraseña requerida -->
                        <input type="password"
                            class="form-control"
                            th:field="*{contrasena}"
                            th:if="${!modoEdicion}"
                            required>

                        <!-- Editar: contraseña opcional -->
                        <input type="password"
                            class="form-control"
                            th:field="*{contrasena}"
                            th:if="${modoEdicion}"
                            placeholder="Dejar en blanco para mantener la actual">
                    </div>
                </div>

                <hr class="my-4">

                <h5 class="fw-bold mb-3">Dirección</h5>

                <!-- FILA 4 -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">País</label>
                        <select class="form-select" th:field="*{idPais}" id="pais" required>
                            <option value="">Seleccione País</option>
                            <option th:each="p : ${paises}" th:value="${p.idPais}" th:text="${p.nombre}"></option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Provincia</label>
                        <select class="form-select" th:field="*{idProvincia}" id="provincia" required>
                            <option value="">Seleccione Provincia</option>
                            <option th:each="pr : ${provincias}" th:value="${pr.idProvincia}" th:text="${pr.nombre}"></option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Cantón</label>
                        <select class="form-select" th:field="*{idCanton}" id="canton" required>
                            <option value="">Seleccione Cantón</option>
                            <option th:each="c : ${cantones}" th:value="${c.idCanton}" th:text="${c.nombre}"></option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Distrito</label>
                        <select class="form-select" th:field="*{idDistrito}" id="distrito" required>
                            <option value="">Seleccione Distrito</option>
                            <option th:each="d : ${distritos}" th:value="${d.idDistrito}" th:text="${d.nombre}"></option>
                        </select>
                    </div>
                </div>

                <!-- FILA 5 -->
                <div class="mb-3">
                    <label class="form-label">Otras señas</label>
                    <input type="text" class="form-control" th:field="*{otrasSenas}">
                </div>

                <!-- BOTONES -->
                <div class="d-flex justify-content-end mt-4">
                    <a href="/usuarios" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>

            </form>

        </div>
    </div>
</div>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
