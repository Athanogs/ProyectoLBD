<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Registro de Asistencia</title>

    <!-- BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background-color: #f4ecdc !important;
        }

        .card {
            border-radius: 12px;
        }

        .card-body {
            background: #ffffff;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">
        <h2 class="fw-bold" th:text="${modoEdicion} ? 'Editar Asistencia' : 'Registrar Asistencia'"></h2>
        <a href="/asistencia" class="btn btn-secondary">← Volver</a>
    </div>

    <!-- Error -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow">
        <div class="card-body">

            <form th:action="${modoEdicion} ? @{/asistencia/actualizar} : @{/asistencia/guardar}"
                  th:object="${asistenciaForm}" method="post">

                <!-- FILA 1 -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Cédula Infante</label>
                        <input type="text" class="form-control" th:field="*{cedulaInfante}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombreInfante}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Fecha Nacimiento</label>
                        <input type="date" class="form-control" th:field="*{fechaNacimiento}" required>
                    </div>
                </div>

                <!-- FILA 2 -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Apellido Paterno</label>
                        <input type="text" class="form-control" th:field="*{apellidoPaterno}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Apellido Materno</label>
                        <input type="text" class="form-control" th:field="*{apellidoMaterno}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Fecha Asistencia</label>
                        <input type="date" class="form-control" th:field="*{fechaAsistencia}" required>
                    </div>
                </div>

                <!-- FILA 3 -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Hora Entrada</label>
                        <input type="time" class="form-control" th:field="*{horaEntrada}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Hora Salida</label>
                        <input type="time" class="form-control" th:field="*{horaSalida}">
                    </div>
                </div>

                <!-- FILA 4 -->
                <div class="mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea class="form-control" th:field="*{observaciones}" rows="3"></textarea>
                </div>

                <!-- FILA 5 -->
                <div class="mb-3">
                    <label class="form-label">Estado Asistencia</label>
                    <select class="form-select" th:field="*{idEstado}" required>
                        <option value="1" th:selected="${asistenciaForm.idEstado == 1}">Activo</option>
                        <option value="2" th:selected="${asistenciaForm.idEstado == 2}">Inactivo</option>
                    </select>
                </div>

                <!-- BOTONES -->
                <div class="d-flex justify-content-end mt-4">
                    <a href="/asistencia" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>

            </form>

        </div>
    </div>
    </body>
</html>
