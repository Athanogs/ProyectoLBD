<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>

    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Estilos personalizados -->
    <style>
        body {
            background: linear-gradient(135deg, #0a7261, #0e9280);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .login-container {
            background: white;
            width: 380px;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .login-container img {
            width: 90px;
            margin-bottom: 10px;
        }

        .login-container h2 {
            font-weight: 600;
            margin-bottom: 20px;
            color: #0a7261;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-login {
            background-color: #0a7261;
            color: white;
            border-radius: 10px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-login:hover {
            background-color: #095f51;
        }

        .footer-text {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- LOGO -->
    <img th:src="@{/assets/logo.png}" alt="logo">

    <h2>Iniciar Sesión</h2>

    <!-- FORMULARIO -->
    <form th:action="@{/login}" method="post">

        <div class="mb-3 text-start">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>

        <div class="mb-3 text-start">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-login">Ingresar</button>
    </form>

    <!-- MENSAJE DE ERROR -->
    <div th:if="${param.error}" class="alert alert-danger mt-3">
        Usuario o contraseña incorrectos.
    </div>

    <p class="footer-text">Happy Kids • Sistema de Gestión</p>

</div>

</body>
</html>
