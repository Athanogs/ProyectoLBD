<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: head('Planificación de Actividades')}"></head>
<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">
        <h2 class="fw-bold" th:text="${modoEdicion} ? 'Editar Actividad' : 'Nueva Actividad'"></h2>
        <a href="/actividades" class="btn btn-secondary">← Volver</a>
    </div>

    <!-- Error -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow">
        <div class="card-body">

            <form th:action="${modoEdicion} ? @{/actividades/actualizar} : @{/actividades/guardar}" 
                  th:object="${actividadForm}" method="post">

                <!-- DESCRIPCIÓN -->
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text" class="form-control" th:field="*{descripcion}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">ID Actividad</label>
                    <input type="number" class="form-control" th:field="*{idActividad}" required>
                </div>

                <!-- FECHA Y HORA -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" th:field="*{fecha}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Hora</label>
                        <input type="time" class="form-control" th:field="*{hora}" required>
                    </div>
                </div>

                <!-- OBSERVACIONES -->
                <div class="mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea class="form-control" th:field="*{observaciones}" rows="3"></textarea>
                </div>

                <!-- GRUPOS -->
                <div class="mb-3">
                    <label class="form-label">Grupos</label>
                    <div class="form-check" th:each="g : ${grupos}">
                        <input class="form-check-input" type="checkbox"
                               th:id="'grupo-' + ${g.idGrupo}"
                               th:value="${g.idGrupo}"
                               th:field="*{idGrupos}">
                        <label class="form-check-label" th:for="'grupo-' + ${g.idGrupo}" th:text="${g.nombre}"></label>
                    </div>
                </div>

                <!-- ESTADO -->
                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select class="form-select" th:field="*{idEstado}">
                        <option value="1" th:selected="${actividadForm.idEstado == 1}">Activo</option>
                        <option value="2" th:selected="${actividadForm.idEstado == 2}">Inactivo</option>
                    </select>
                </div>

                <!-- BOTONES -->
                <div class="d-flex justify-content-end mt-4">
                    <a href="/actividades" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- BOOTSTRAP 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
    body {
        background-color: #f4ecdc !important;
    }

    .card {
        border-radius: 12px;
    }

    .card-body {
        background: #ffffff;
        border-radius: 12px;
    }
</style>

</body>
</html>
