<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:fragment="head(tituloPagina)">
    <meta charset="UTF-8">
    <title th:text="${tituloPagina} ?: 'Panel Administrativo'">Panel Administrativo</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" th:fragment="sidebar">

    <div class="profile">
        <img src="/assets/logo.png" alt="logo">
        <h3>Happy Kids</h3>
        <span>Administrador</span>
    </div>

    <nav class="menu">

        <a th:href="@{/usuarios}"
           th:class="'item ' + (${activePage} == 'usuarios' ? 'active' : '')">
            Gestión de Usuarios
        </a>

        <a th:href="@{/docentes}"
           th:class="'item ' + (${activePage} == 'docentes' ? 'active' : '')">
            Gestión de Docentes
        </a>

        <a th:href="@{/infantes}"
           th:class="'item ' + (${activePage} == 'infantes' ? 'active' : '')">
            Gestión de Infantes
        </a>

        <!-- ✅ NUEVA OPCIÓN: GESTIÓN DE CONTACTOS -->
        <a th:href="@{/contactos}"
           th:class="'item ' + (${activePage} == 'contactos' ? 'active' : '')">
            Gestión de Contactos
        </a>

        <a th:href="@{/actividades}"
           th:class="'item ' + (${activePage} == 'actividades' ? 'active' : '')">
            Planificación de Actividades
        </a>

        <a th:href="@{/asistencia}"
           th:class="'item ' + (${activePage} == 'asistencia' ? 'active' : '')">
            Registro de Asistencia
        </a>

        <a th:href="@{/cuotasEscolares}"
           th:class="'item ' + (${activePage} == 'cuotas' ? 'active' : '')">
            Cuotas Escolares
        </a>

        <a th:href="@{/gestionFinanciera}"
           th:class="'item ' + (${activePage} == 'finanzas' ? 'active' : '')">
            Gestión Financiera
        </a>

        <a th:href="@{/reportes}"
           th:class="'item ' + (${activePage} == 'reportes' ? 'active' : '')">
            Reportes
        </a>

        <a th:href="@{/auditoria}"
           th:class="'item ' + (${activePage} == 'auditoria' ? 'active' : '')">
            Auditoría
        </a>
    </nav>

    <div class="logout">
        <a th:href="@{/logout}">
            ⟵ Cerrar Sesión
        </a>
    </div>

</aside>

<!-- LAYOUT PRINCIPAL -->
<div class="layout-container" th:fragment="layout">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <main class="content">
        <th:block th:replace="~{::contenido}"></th:block>
    </main>
</div>

</body>
</html>
