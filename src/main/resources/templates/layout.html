<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:fragment="head(tituloPagina)">
    <meta charset="UTF-8">
    <title th:text="${tituloPagina} ?: 'Panel Administrativo'">Panel Administrativo</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" th:fragment="sidebar">

    <div class="profile">
        <img src="https://i.pravatar.cc/100" alt="avatar">
        <h3>Olivia Wilson</h3>
        <span>Administrador</span>
    </div>

    <nav class="menu">

        <a th:href="@{/}"
           th:class="'item ' + (${activePage} == 'inicio' ? 'active' : '')">
            Inicio
        </a>

        <a th:href="@{/usuarios}"
           th:class="'item ' + (${activePage} == 'usuarios' ? 'active' : '')">
            Gestión de Usuarios
        </a>

        <a th:href="@{/docentes}"
           th:class="'item ' + (${activePage} == 'docentes' ? 'active' : '')">
            Gestión de Docentes
        </a>

        <a th:href="@{/infantes}"
           th:class="'item ' + (${activePage} == 'infantes' ? 'active' : '')">
            Gestión de Infantes
        </a>

        <a th:href="@{/actividades}" class="item">Planificación de Actividades</a>
        <a th:href="@{/asistencia}" class="item">Registro de Asistencia</a>
        <a th:href="@{/entradas-salidas}" class="item">Entradas y Salidas</a>
        <a th:href="@{/matriculas}" class="item">Matrículas y Mensualidades</a>
        <a th:href="@{/pagos}" class="item">Facturación y Pagos</a>
        <a th:href="@{/reportes}" class="item">Reportes</a>
        <a th:href="@{/auditoria}" class="item">Auditoría</a>
    </nav>

    <div class="logout">
        <a th:href="@{/logout}">
            ⟵ Cerrar Sesión
        </a>
    </div>

</aside>

<!-- LAYOUT PRINCIPAL -->
<div class="layout-container" th:fragment="layout">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <main class="content">
        <th:block th:insert="${content}"></th:block>
    </main>
</div>

</body>
</html>
