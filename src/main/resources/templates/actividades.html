<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="layout :: head('Planificación de Actividades')"></head>

<body>
    <div class="d-flex">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="content">
            <h1 class="mb-4">Planificación de Actividades</h1>

            <div class="card p-4">
                <h2 class="mb-4">Planificación de Actividades</h2>

                <form class="row g-3 mb-4" method="get" action="/actividades">
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="descripcion" placeholder="Buscar por descripción"
                            th:value="${descripcion}">
                    </div>

                    <div class="col-md-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary mb-3">Buscar</button>
                        <a href="/actividades" class="btn btn-secondary mb-3">Limpiar</a>
                        <a href="/actividades/nueva" class="btn btn-primary mb-3">+ Nueva Actividad</a>
                    </div>
                </form>
                
                <div class="tabla-scroll">
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>Descripción</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Grupos</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="a : ${listaActividades}">
                                <td th:text="${a.descripcion}"></td>
                                <td th:text="${a.fecha}"></td>
                                <td th:text="${a.hora}"></td>
                                <td th:text="${a.nombreGrupo}"></td>
                                <td th:text="${a.estadoActividad}"></td>
                                <td class="text-center">
                                    <a th:href="@{'/actividades/editar/' + ${a.idActividad}}"
                                        class="btn btn-warning btn-sm">Editar</a>
                                    <a th:href="@{'/actividades/eliminar/' + ${a.idActividad}}"
                                        class="btn btn-danger btn-sm"
                                        onclick="return confirm('¿Desea eliminar esta actividad?');">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listaActividades)}">
                                <td colspan="6" class="text-center">No se encontraron actividades</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
</body>
<style>
    .tabla-scroll {
        max-height: calc(80vh - 100px);
        overflow-y: auto;
        overflow-x: auto;
        padding-right: 10px;
        border: 1px solid #ddd;
        background: white;
    }

    .tabla-scroll table {
        width: max-content;
        min-width: 100%;
    }
</style>
</html>
